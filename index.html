    <!-- Font preloaded in HTML: no fallback-font flash. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/urbanist/files/urbanist-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Urbanist Variable";
        font-style: normal;
        font-display: block;
        font-weight: 100 900;
        src: url("/node_modules/@fontsource-variable/urbanist/files/urbanist-latin-wght-normal.woff2") format("woff2-variations");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 210;
        display: grid;
        place-items: center;
        background: #0c0c0c;
        color: #d7e2ea;
        font-family: "Urbanist Variable", Urbanist, ui-sans-serif, system-ui, sans-serif;
        transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1) 0.45s;
      }
      #boot .boot-in {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform 0.7s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.5s ease;
      }
      #boot .boot-kicker {
        margin: 0 0 1rem;
        font-size: 0.7rem;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        padding-left: 0.42em;
        opacity: 0;
      }
      #boot .boot-name {
        display: flex;
        overflow: hidden;
        margin: 0;
        padding-bottom: 0.08em;
        font-size: clamp(2.6rem, 8vw, 4.75rem);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      #boot .boot-name span {
        display: inline-block;
        background-image: linear-gradient(100deg, transparent 42%, #ffffffe6 50%, transparent 58%),
          linear-gradient(#8b969f, #d7e2ea);
        background-size: 300% 100%, 100% 100%;
        background-repeat: no-repeat;
        background-position: 110% 0, 0 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        transform: translateY(110%);
      }
      #boot .boot-track {
        position: relative;
        width: 5rem;
        height: 2px;
        margin-top: 2.75rem;
        overflow: hidden;
        border-radius: 2px;
        background: #d7e2ea1f;
        opacity: 0;
        animation: boot-fade 0.5s ease 0.1s forwards;
      }
      #boot.is-ready .boot-kicker {
        animation: boot-fade 1s ease 0.1s forwards;
      }
      #boot.is-ready .boot-name span {
        animation: boot-rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards, boot-shine 5s linear infinite;
        animation-delay: calc(0.15s + var(--i) * 0.05s), calc(1.3s + var(--i) * 0.14s);
      }
      #boot .boot-bar {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #d7e2ea59, #d7e2ea);
        transform: scaleX(0);
        transform-origin: left;
      }
      #boot.is-out .boot-in {
        transform: translateY(-2.5rem);
        opacity: 0;
      }
      #boot.is-out {
        transform: translateY(-101%);
      }
      @keyframes boot-rise {
        to {
          transform: none;
        }
      }
      @keyframes boot-shine {
        0% {
          background-position: 110% 0, 0 0;
        }
        14%,
        100% {
          background-position: -10% 0, 0 0;
        }
      }
      @keyframes boot-fade {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot .boot-in {
          transition: opacity 0.4s ease;
        }
        #boot .boot-in {
          opacity: 0;
        }
        #boot.is-ready .boot-in {
          opacity: 1;
        }
        #boot.is-ready .boot-name span,
        #boot.is-ready .boot-kicker,
        #boot .boot-track {
          animation: none;
          transform: none;
          opacity: 1;
        }
        #boot.is-out .boot-in {
          opacity: 0;
        }
        #boot.is-out {
          transform: none;
          opacity: 0;
        }
      }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
  </head>
  <body>
    <!-- Boot loader: public/js/boot.js, lifted by src/shell/Preloader.tsx. -->
    <div id="boot" aria-hidden="true">
      <div class="boot-in">
        <p class="boot-kicker">Portfolio</p>
        <p class="boot-name"><span style="--i: 0">S</span><span style="--i: 1">E</span><span style="--i: 2">N</span><span style="--i: 3">T</span><span style="--i: 4">H</span><span style="--i: 5">U</span><span style="--i: 6">R</span><span style="--i: 7">V</span><span style="--i: 8">E</span><span style="--i: 9">L</span></p>
        <div class="boot-track"><div class="boot-bar"></div></div>
      </div>
    </div>
    <script src="/js/boot.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
